# ★ 8155 – hyprlock
# Farben kommen aus dem aktiven Farbthema (themen/<name>/hyprlock.conf, umgeschaltet von scripts/thema.sh)
source = /home/edu/.config/hypr/themen/aktiv/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = glide, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, glide
    animation = fadeOut, 1, 5, glide
    animation = inputFieldDots, 1, 2, glide
}

background {
    monitor =
    path = /home/edu/.config/hypr/wallpapers/current
    blur_passes = 2
    blur_size = 6
    brightness = $helligkeit
    vibrancy = 0.2
    noise = 0.015
}

# ★ 8155
label {
    monitor =
    text = <i><span font_features="lnum">★  8155</span></i>
    color = $akzent
    font_size = 42
    font_family = Cormorant Garamond
    position = 0, 275
    halign = center
    valign = center
}

# Uhrzeit
label {
    monitor =
    text = <span font_features="lnum">$TIME</span>
    color = $uhrfarbe
    font_size = 140
    font_family = Cormorant Garamond Light
    position = 0, 130
    halign = center
    valign = center
}

# Datum
label {
    monitor =
    text = cmd[update:60000] echo "<i><span font_features=\"lnum\">$(date +'%A  ·  %-d. %B')</span></i>"
    color = $datumfarbe
    font_size = 20
    font_family = Cormorant Garamond
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    rounding = 23
    outer_color = $randfarbe
    inner_color = $feldfarbe
    font_color = $textfarbe
    check_color = $zweitfarbe
    fail_color = rgba(e0714fcc)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>passwort …</i>
    fail_text = <i>$PAMFAIL</i>
    dots_size = 0.22
    dots_spacing = 0.5
    fade_on_empty = false
    position = 0, -110
    halign = center
    valign = center
}

# Musik
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/nowplaying.sh
    color = $zweitfarbe
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
