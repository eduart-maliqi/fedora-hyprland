# ★ 8155 – kitty

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

background_opacity   0.74
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

cursor_shape      beam
cursor_trail      3
cursor_blink_interval 0.6

tab_bar_style     powerline
tab_powerline_style round

# ── Farben ───────────────────────────────────────────
# Grundfarben, Auswahl, Cursor, Tabs: aktives Farbthema (umgeschaltet von ~/.config/hypr/scripts/thema.sh,
# das kitty per SIGUSR1 neu laden lässt)
include ~/.config/hypr/themen/aktiv/kitty.conf

# schwarz
color0  #1e252c
color8  #4a545c
# rot
color1  #d9725a
color9  #e88a70
# grün (salbei)
color2  #9bb07a
color10 #b3c78f
# gelb / amber
color3  #e3a142
color11 #f2c57c
# blau (schiefer)
color4  #7f9fb5
color12 #9db8cb
# magenta
color5  #c48ba0
color13 #d6a3b6
# cyan
color6  #83b3a8
color14 #9fcabf
# weiß
color7  #d8d0c0
color15 #f3ecdf

# ── Kopieren / Einfügen wie gewohnt ─────────────────
# Strg+V: Text → einfügen, Bild (Screenshot) → ans Programm durchreichen (smart_paste.py)
# Strg+C: kopiert, wenn etwas markiert ist – sonst bricht es wie üblich ab
map ctrl+v kitten smart_paste.py
map ctrl+c copy_or_interrupt
